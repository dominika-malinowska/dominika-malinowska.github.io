  sections:
    Education:
      - institution: University of Bath
        location: Bath, UK / Remote
        url: https://www.bath.ac.uk/
        area: Civil Engineering (specialising in Remote Sensing)
        studyType: PhD
        start_date: 2019-12
        end_date: 2025-11
        score: ""
        highlights:
          - Advanced the application of MT-InSAR for infrastructure monitoring and hazard mitigation by integrating ML, structural analysis, risk assessment, and social vulnerability.

      - institution: Cranfield University
        location: Cranfield, UK
        url: https://www.cranfield.ac.uk/
        area: Astronautics and Space Engineering
        studyType: MSc
        start_date: 2018-09
        end_date: 2019-09
        highlights:
          - Graduated with Distinction; received Course Director’s Prize for outstanding performance.
          - Conducted a system-level analysis for integrating a CubeSat laboratory (BAMMsat) into flight opportunities.

    Experience:
      - company: Spottitt (now part of Lucey Group)
        position: R&D Machine Learning Expert
        location: Poland / Remote
        start_date: 2025-06
        end_date: Present
        highlights:
          - Led and contributed to data science and AI projects across the group, including development of a commercial SAR-based product for house subsidence monitoring.
          - Reduced false positives by ~75% for a key power line monitoring project by integrating an off-the-shelf cloud masking solution into the production pipeline.
          - Engineered an ML pipeline for object height estimation from single optical images using PyTorch/TorchGeo, adapting research architectures for commercial tasks.

      - company: University of Bath
        position: Doctoral Researcher
        location: UK / Remote
        start_date: 2019-12
        end_date: 2025-11
        highlights:
          - Led a global geo-hazard risk assessment of long-span bridges using InSAR availability with a team of 5, demonstrating Sentinel-1 operational viability for worldwide infrastructure monitoring.
          - Published first-author work in Nature Communications (Editors’ Highlights, DOI: 10.1038/s41467-025-64260-x).
          - Built a U-Net-based model to predict MT-InSAR measurement points density, improving Sentinel-1 data usability for infrastructure monitoring; published in IEEE JSTARS (DOI: 10.1109/JSTARS.2024.3449688).
          - Developed a multidisciplinary framework to prioritise SAR-based monitoring to improve safety and support socially equitable bridge maintenance.

      - company: TU Delft
        position: Visiting Researcher
        location: Netherlands / Remote
        start_date: 2020-03
        end_date: 2025-11

      - company: Frontier Development Lab (FDL) Europe
        position: Researcher
        location: Remote
        start_date: 2024-06
        end_date: 2024-10
        highlights:
          - Co-led an 8-person R&D project to develop an ML pipeline for solar flare prediction for the ESA Vigil 2.0 mission, managing task planning, workload distribution, and partner meetings.
          - Proposed innovative labelling methods and delivered technical reports to ESA stakeholders within tight deadlines; presented results via live stream.

      - company: SCISYS Space Division (now part of CGI)
        position: Intern in Earth Observation (EO) Group
        location: UK
        start_date: 2019-07
        end_date: 2019-08
        highlights:
          - Evaluated autonomous detection of features on optical imagery, identifying key performance issues for further optimisation.
          - Supported EO project proposal development, aligning early-stage research with tender requirements.

      - company: SCISYS Space Division (now part of CGI)
        position: Software Test Engineer
        location: UK
        start_date: 2018-04
        end_date: 2018-09
        highlights:
          - Defined and executed manual tests, reported anomalies, and verified requirements with a traceability matrix to ensure comprehensive test coverage for satellite constellation scheduling software.

