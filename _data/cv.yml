  summary: >-
    AI/ML engineer and researcher with 6+ years’ experience in Python for geospatial analytics. Expertise in converting complex SAR and optical data into actionable monitoring tools and automated pipelines to improve data usability for decision-making, backed by high-impact publications. Skilled at leading interdisciplinary collaborations and communicating technical concepts to partners such as ESA and industry stakeholders. Eager to deploy robust ML models and operationalise multi-sensor Earth Observation workflows to deliver critical, scalable monitoring solutions.

